name: Fetch schedule

# 発売・配信予定を取り直す。**カレンダーなので毎日走らせる。**
# 予定は日々変わるし、鮮度がこのサイトの取り柄そのもの。

on:
  schedule:
    - cron: '0 20 * * *'   # 05:00 JST
  workflow_dispatch:
    inputs:
      months_ahead:
        description: '何か月先まで取るか'
        type: string
        default: '3'
      months_back:
        description: '何か月前まで取るか'
        type: string
        default: '1'

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 発売予定を取る
        env:
          FANZA_API_ID: ${{ secrets.FANZA_API_ID }}
          # **承認が下りるまで空でよい。** 空なら素の作品URLで作る
          # （参加規約 第7条：申請していないサイトでのID利用は禁止行為）。
          FANZA_AFFILIATE_ID: ${{ secrets.FANZA_AFFILIATE_ID }}
          MONTHS_AHEAD: ${{ inputs.months_ahead || '3' }}
          MONTHS_BACK: ${{ inputs.months_back || '1' }}
        run: python scripts/fetch-schedule.py

      - name: 変わっていたらコミットする
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/schedule.json

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "変わっていないので、そのままにします"
          else
            git commit -m "発売予定を取り直す"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # **呼ぶ側で権限を渡す。** 再利用ワークフローは呼び出し元より強い権限を
  # 持てないため、ここで pages と id-token を明示しないと起動前に落ちる
  # （startup_failure になり、ログも出ない）。
  deploy:
    needs: fetch
    if: needs.fetch.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
